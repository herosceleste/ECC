# Garage : stockage objet compatible S3, développé par l'association Deuxfleurs.
# Un seul nœud suffit en développement et pour un pilote ; en production, prévoir
# trois nœuds (replication_factor = 3) ou le service S3 d'un hébergeur européen.
# Écoute en IPv4 : de nombreux réseaux Docker n’ont pas d’IPv6.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"
# rpc_secret et admin_token sont fournis par les variables
# GARAGE_RPC_SECRET et GARAGE_ADMIN_TOKEN (voir docker-compose.yml).

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "0.0.0.0:3903"
