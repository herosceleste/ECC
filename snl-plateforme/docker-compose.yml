# Environnement de développement complet du socle.
#   cp .env.example .env   (puis remplir les secrets)
#   docker compose up -d --build
#
# Services : PostgreSQL, Keycloak, Garage (stockage S3), ClamAV, Mailpit, l'API et l'interface web.
# Les migrations s'exécutent automatiquement avant le démarrage de l'API.

name: snl-plateforme

services:
  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: snl
      POSTGRES_USER: snl_proprietaire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
      SNL_APP_PASSWORD: ${SNL_APP_PASSWORD:?à définir dans .env}
    volumes:
      - donnees-postgres:/var/lib/postgresql/data
      - ./infra/postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snl_proprietaire -d snl"]
      interval: 5s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  keycloak-db:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?à définir dans .env}
    volumes:
      - donnees-keycloak:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      retries: 20

  keycloak:
    # Image officielle, publiée aussi sur Docker Hub (identique à quay.io).
    image: keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?à définir dans .env}
      KC_HOSTNAME: http://localhost:8080
      # Substitué dans le fichier du royaume au moment de l'import.
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?à définir dans .env}
    volumes:
      - ./infra/keycloak/royaume-snl.json:/opt/keycloak/data/import/royaume-snl.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  # Stockage des documents, compatible S3. MinIO ne distribue plus d'images
  # communautaires ; Garage (association Deuxfleurs) le remplace.
  garage:
    image: dxflrs/garage:v1.0.1
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?à définir dans .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?à définir dans .env}
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - donnees-garage:/var/lib/garage
    ports:
      # Exposé pour que le navigateur suive les liens de téléchargement signés.
      - "127.0.0.1:3900:3900"

  garage-init:
    image: node:22-bookworm-slim
    command: ["node", "/init/initialiser.mjs"]
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?à définir dans .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?à définir dans .env}
      S3_BUCKET: documents
    volumes:
      - ./infra/garage/initialiser.mjs:/init/initialiser.mjs:ro
    depends_on:
      - garage

  clamav:
    image: clamav/clamav:1.4
    volumes:
      - donnees-clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      retries: 20
      start_period: 120s

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:8025:8025"

  migrations:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: construction
    working_dir: /depot/apps/api
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://snl_proprietaire:${POSTGRES_PASSWORD}@postgres:5432/snl
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://snl_app:${SNL_APP_PASSWORD}@postgres:5432/snl
      OIDC_ISSUER: http://localhost:8080/realms/snl
      OIDC_JWKS_URL: http://keycloak:8080/realms/snl/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      S3_ENDPOINT: http://garage:3900
      # Adresse utilisée pour signer les liens de téléchargement remis au navigateur.
      S3_ENDPOINT_PUBLIC: http://localhost:3900
      S3_REGION: garage
      CLAMAV_HOTE: clamav
      # En développement, les courriels sont capturés par Mailpit (http://localhost:8025).
      SMTP_HOTE: mailpit
      SMTP_PORT: "1025"
    depends_on:
      migrations:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      URL_PUBLIQUE_WEB: http://localhost:3000
      API_URL: http://api:3001
      # Le navigateur joint Keycloak par localhost, le serveur Next par le réseau Docker.
      OIDC_ISSUER: http://localhost:8080/realms/snl
      OIDC_ISSUER_INTERNE: http://keycloak:8080/realms/snl
      OIDC_CLIENT_ID: snl-web
      SECRET_SESSION: ${SECRET_SESSION:?à définir dans .env}
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  donnees-postgres:
  donnees-keycloak:
  donnees-garage:
  donnees-clamav:
