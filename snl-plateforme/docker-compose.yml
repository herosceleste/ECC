# Environnement de développement complet du socle.
#   cp .env.example .env   (puis remplir les secrets)
#   docker compose up -d --build
#
# Services : PostgreSQL, Keycloak, MinIO, ClamAV, Mailpit et l'API.
# Les migrations s'exécutent automatiquement avant le démarrage de l'API.

name: snl-plateforme

services:
  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: snl
      POSTGRES_USER: snl_proprietaire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
      SNL_APP_PASSWORD: ${SNL_APP_PASSWORD:?à définir dans .env}
    volumes:
      - donnees-postgres:/var/lib/postgresql/data
      - ./infra/postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snl_proprietaire -d snl"]
      interval: 5s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  keycloak-db:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?à définir dans .env}
    volumes:
      - donnees-keycloak:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?à définir dans .env}
      KC_HOSTNAME: http://localhost:8080
      # Substitué dans le fichier du royaume au moment de l'import.
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?à définir dans .env}
    volumes:
      - ./infra/keycloak/royaume-snl.json:/opt/keycloak/data/import/royaume-snl.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?à définir dans .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?à définir dans .env}
    volumes:
      - donnees-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY}
      && mc mb --ignore-existing local/documents
      && mc anonymous set none local/documents"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}

  clamav:
    image: clamav/clamav:1.4.1
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      retries: 20
      start_period: 120s

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:8025:8025"

  migrations:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: construction
    working_dir: /depot/apps/api
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://snl_proprietaire:${POSTGRES_PASSWORD}@postgres:5432/snl
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://snl_app:${SNL_APP_PASSWORD}@postgres:5432/snl
      OIDC_ISSUER: http://localhost:8080/realms/snl
      OIDC_JWKS_URL: http://keycloak:8080/realms/snl/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      S3_ENDPOINT: http://minio:9000
      CLAMAV_HOTE: clamav
    depends_on:
      migrations:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  donnees-postgres:
  donnees-keycloak:
  donnees-minio:
